
{% extends 'base.html' %}

{% block title %}Delete Setup | SonicBench{% endblock %}

{% block content %}

<section class="page-section container">

    <div class="delete-container">

        <p class="eyebrow">DANGER ZONE</p>

        <h1>Delete {{ object.name }}?</h1>

        <p>
            Are you sure you want to permanently
            delete this listening setup?
        </p>

        <p class="warning-text">
            This action cannot be undone.
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button type="submit"
                        class="danger-button">
                    Yes, Delete Setup
                </button>

                <a
                    href="{% url 'setups:setup_detail' object.pk %}"
                    class="secondary-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
